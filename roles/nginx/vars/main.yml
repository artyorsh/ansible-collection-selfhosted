---
nginx_docker_settings_default:
  networks: []
  puid: "1000"
  pgid: "1000"
  tz: "Etc/UTC"
  published_ports:
    - "{{ nginx_port_http }}:80"
    - "{{ nginx_port_https }}:443"
    - "{{ nginx_port_admin }}:81"

nginx_env_default:
  TZ: "{{ nginx_docker_settings.tz }}"
  PUID: "{{ nginx_docker_settings.puid }}"
  PGID: "{{ nginx_docker_settings.pgid }}"
