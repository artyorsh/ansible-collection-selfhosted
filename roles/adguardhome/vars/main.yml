---
adguardhome_docker_settings_default:
  network: "host"
  puid: "1000"
  pgid: "1000"
  tz: "Etc/UTC"
  published_ports:
    # https://github.com/AdguardTeam/AdGuardHome/wiki/Docker#create-and-run-the-container
    - "53:53/tcp"
    - "53:53/udp"
    - "3000:3000/tcp"

adguardhome_env_default:
  TZ: "{{ adguardhome_docker_settings.tz }}"
  PUID: "{{ adguardhome_docker_settings.puid }}"
  PGID: "{{ adguardhome_docker_settings.pgid }}"
