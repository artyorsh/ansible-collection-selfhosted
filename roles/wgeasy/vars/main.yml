---
wgeasy_docker_settings_default:
  networks: []
  puid: "1000"
  pgid: "1000"
  tz: "Etc/UTC"
  published_ports:
    - "51820:51820/udp"
    - "51821:51821/tcp"

wgeasy_env_default:
  TZ: "{{ wgeasy_docker_settings.tz }}"
  PUID: "{{ wgeasy_docker_settings.puid }}"
  PGID: "{{ wgeasy_docker_settings.pgid }}"
  WG_HOST: "{{ ansible_host }}"
  WG_DEFAULT_ADDRESS: "10.8.0.x"
  WG_PORT: "51820"
  WG_PERSISTENT_KEEPALIVE: "25"
